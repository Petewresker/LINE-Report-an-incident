AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LINE Report-an-incident: Backend with AI Analysis, SNS, and optimized deployment size.

Resources:
  # 1. S3 Bucket สำหรับเก็บรูปภาพ
  IncidentImageBucket:
    Type: AWS::S3::Bucket

  # 2. DynamoDB Table (อิงตาม GSI ใน GitHub ของคุณ)
  IncidentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "IncidentReports-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: AgencyAccessToken
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1_AgencyPortal
          KeySchema:
            - AttributeName: AgencyAccessToken
              KeyType: HASH
            - AttributeName: PK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 3. SNS Topic สำหรับแจ้งเตือนหน่วยงาน
  AgencyNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "AgencyNotification-${AWS::StackName}"

  # 4. Lambda Function (ใช้ esbuild เพื่อแก้ปัญหาพื้นที่เกิน)
  IncidentProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: server/
      # ปรับ Handler ให้ตรงกับไฟล์ใน GitHub (src/app.ts จะถูก build เป็น app.js)
      Handler: lambda.handler
      Runtime: nodejs18.x
      MemorySize: 512
      Timeout: 30
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          TABLE_NAME: !Ref IncidentTable
          BUCKET_NAME: !Ref IncidentImageBucket
          SNS_TOPIC_ARN: !Ref AgencyNotificationTopic
          REGION: !Ref AWS::Region

      Events:
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY

    # --- ส่วนสำคัญ: ใช้ esbuild เพื่อบีบอัดไฟล์ให้เล็กลง ---
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        # ชี้ไปที่ไฟล์เริ่มต้นในโฟลเดอร์ server/src/
        EntryPoints: 
          - src/lambda.ts
        External:
          - "@aws-sdk/*" 
          - "aws-sdk" 

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  SnsTopicArn:
    Value: !Ref AgencyNotificationTopic
  TableName:
    Value: !Ref IncidentTable